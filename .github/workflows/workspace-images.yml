name: Workspace Images

on:
  push:
    branches:
      - workspace/dev
  workflow_dispatch:

concurrency:
  group: workspace-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Scan changed files
        run: bash .github/scripts/workspace-secret-scan.sh "${{ github.event.before }}"

  build:
    name: Build ${{ matrix.image }}
    needs: secret-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: pds
            image: atproto-pds
          - service: bsky
            image: atproto-bsky
          - service: bsync
            image: atproto-bsync
          - service: ozone
            image: atproto-ozone
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push commit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  build-dev:
    name: Build local dev images
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push PLC
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/dev/plc
          file: .github/dev/plc/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.owner }}/atproto-dev-plc:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=atproto-dev-plc
          cache-to: type=gha,mode=max,scope=atproto-dev-plc
      - name: Build and push dataplane
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/dev/dataplane
          file: .github/dev/dataplane/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BSKY_IMAGE=ghcr.io/${{ steps.ns.outputs.owner }}/atproto-bsky:${{ github.sha }}
          tags: ghcr.io/${{ steps.ns.outputs.owner }}/atproto-dev-dataplane:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=atproto-dev-dataplane
          cache-to: type=gha,mode=max,scope=atproto-dev-dataplane

  promote:
    name: Move dev tags
    needs: [build, build-dev]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote all commit images to dev only after every build succeeded
        env:
          OWNER: ${{ steps.ns.outputs.owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in atproto-pds atproto-bsky atproto-bsync atproto-ozone atproto-dev-plc atproto-dev-dataplane; do
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/${image}:dev" \
              "ghcr.io/${OWNER}/${image}:${SHA}"
          done
